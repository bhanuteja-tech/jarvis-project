[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-project"
version = "0.1.0"
description = "Production-oriented AI Job Discovery and Resume Tailoring System"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langgraph>=0.2",
    "sqlalchemy>=2.0.31",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
# Optional Layer-4 rendering support (large download; never required for the
# default test suite). Browser binaries are installed separately via
# `playwright install chromium`.
browser = [
    "playwright>=1.45",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m \"not live\""
markers = [
    "live: explicitly-invoked live API smoke tests requiring network access (excluded from default runs)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
